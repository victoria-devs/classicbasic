# Default build target for Alpine Linux (musl libc)
[build]
target = "x86_64-alpine-linux-musl"
rustc-wrapper = ".cargo/rustc-wrapper.sh"
rustdoc = ".cargo/rustdoc.sh"

[target.i686-pc-windows-msvc]
# Pass the Module Definition File to MSVC link.exe to preserve exact export ordinals (100 to 2010)
rustflags = ["-C", "link-arg=/DEF:msvbvm60.def"]

[target.i686-pc-windows-gnu]
# Pass kill-at for MinGW linker to avoid decorating stdcall symbols with @<bytes>
rustflags = ["-C", "link-arg=-Wl,--kill-at"]

[target.i686-alpine-linux-musl]
# Alpine Linux 32-bit (musl libc): allow dynamic cdylib shared library generation
rustflags = ["-C", "target-feature=-crt-static"]

[target.x86_64-alpine-linux-musl]
# Alpine Linux 64-bit (musl libc): allow dynamic cdylib shared library generation
rustflags = ["-C", "target-feature=-crt-static"]
