[workspace]
resolver = "2"
members = [
    "crates/cb-x86",
    "crates/cb-vfs",
    "crates/cb-pe",
    "crates/cb-win32",
    "crates/cb-net",
    "crates/msvbvm60",
    "crates/vb6-run",
    "crates/cb-session",
    "crates/cb-client",
]

[workspace.package]
version = "0.2.17"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cb-x86 = { path = "crates/cb-x86" }
cb-vfs = { path = "crates/cb-vfs" }
cb-pe = { path = "crates/cb-pe" }
cb-win32 = { path = "crates/cb-win32" }
cb-net = { path = "crates/cb-net" }
msvbvm60 = { path = "crates/msvbvm60" }
cb-client = { path = "crates/cb-client" }
cb-session = { path = "crates/cb-session" }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.clippy]
approx_constant = "allow"
missing_safety_doc = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
manual_range_contains = "allow"
manual_is_multiple_of = "allow"
collapsible_if = "allow"
if_same_then_else = "allow"
derivable_impls = "allow"
useless_borrows_in_formatting = "allow"
needless_return = "allow"
zero_ptr = "allow"
unnecessary_cast = "allow"
