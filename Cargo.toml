[package]
name = "msvbvm60"
version = "0.2.12"
edition = "2021"
description = "A native Rust implementation of the Visual Basic 6.0 Runtime (msvbvm60.dll)"
readme = "README.md"

[lib]
name = "msvbvm60"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []
trace_calls = [] # Enable logging of all exported function calls for debugging / reverse engineering

[dependencies]
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "vb6-run"
path = "src/bin/vb6_run.rs"

[lints.clippy]
approx_constant = "allow"
missing_safety_doc = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
manual_range_contains = "allow"
manual_is_multiple_of = "allow"
collapsible_if = "allow"
if_same_then_else = "allow"
derivable_impls = "allow"
useless_borrows_in_formatting = "allow"
needless_return = "allow"
zero_ptr = "allow"
unnecessary_cast = "allow"

