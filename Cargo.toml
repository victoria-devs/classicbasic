[package]
name = "msvbvm60"
version = "0.1.0"
edition = "2021"
description = "A native Rust implementation of the Visual Basic 6.0 Runtime (msvbvm60.dll)"
readme = "README.md"

[lib]
name = "msvbvm60"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []
trace_calls = [] # Enable logging of all exported function calls for debugging / reverse engineering

[dependencies]
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "vb6-run"
path = "src/bin/vb6_run.rs"
