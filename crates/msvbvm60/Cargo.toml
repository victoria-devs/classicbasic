[package]
name = "msvbvm60"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clean-room native Rust implementation of the Visual Basic 6.0 Runtime (msvbvm60.dll)"

[lib]
name = "msvbvm60"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["cb-x86/std", "cb-win32/std"]
trace_calls = []

[dependencies]
cb-pe = { workspace = true }
cb-vfs = { workspace = true }
cb-win32 = { workspace = true }
cb-x86 = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "foundations"
path = "tests/foundations/main.rs"

[[test]]
name = "types_automation"
path = "tests/types_automation/main.rs"

[[test]]
name = "runtime_library"
path = "tests/runtime_library/main.rs"

[[test]]
name = "com_dispatch_typelib"
path = "tests/com_dispatch_typelib/main.rs"

[lints]
workspace = true
