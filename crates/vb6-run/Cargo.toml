[package]
name = "vb6-run"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone Visual Basic 6.0 PE32 Runner, Inspector, and Web-Streamed GUI Host"

[[bin]]
name = "vb6-run"
path = "src/main.rs"

[[test]]
name = "retroactive_pe"
path = "tests/retroactive_pe/main.rs"

[[test]]
name = "retroactive_binaries"
